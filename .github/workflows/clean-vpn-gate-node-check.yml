name: Clean VPN Gate Node Check Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete old VPN Gate Node Check runs, keep only 1 latest
        run: |
          set -e

          WORKFLOW_FILE=".github/workflows/check.yml"
          WORKFLOW_NAME="VPN Gate Node Check"

          echo "仓库: $REPO"
          echo "工作流名称: $WORKFLOW_NAME"
          echo "工作流文件: $WORKFLOW_FILE"

          WORKFLOW_ID=$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/actions/workflows" \
            --jq '.workflows[] | select(.path == $WORKFLOW_FILE) | .id')

          if [ -z "$WORKFLOW_ID" ]; then
            echo "未通过文件路径找到工作流，尝试通过名称查找..."
            WORKFLOW_ID=$(gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPO/actions/workflows" \
              --jq '.workflows[] | select(.name == $WORKFLOW_NAME) | .id')
          fi

          if [ -z "$WORKFLOW_ID" ]; then
            echo "::error::找不到工作流，请确认文件名和名称是否正确"
            exit 1
          fi

          echo "找到工作流 ID: $WORKFLOW_ID"

          RUN_IDS=$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/actions/workflows/$WORKFLOW_ID/runs" \
            --paginate \
            --jq '.workflow_runs[] | select(.conclusion != null) | .id')

          if [ -z "$RUN_IDS" ]; then
            echo "没有已完成的运行记录，无需清理。"
            exit 0
          fi

          RUN_ARR=($RUN_IDS)
          TOTAL=${#RUN_ARR[@]}
          echo "共找到 $TOTAL 条已完成记录。"

          if [ "$TOTAL" -le 1 ]; then
            echo "记录数量已满足要求，无需删除。"
            exit 0
          fi

          for ((i = 1; i < TOTAL; i++)); do
            RUN_ID="${RUN_ARR[$i]}"
            echo "正在删除旧 run id: $RUN_ID"
            gh api \
              --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPO/actions/runs/$RUN_ID" \
              || true
            sleep 0.3
          done

          echo "✅ 清理完成，仅保留最新 1 条记录。"
