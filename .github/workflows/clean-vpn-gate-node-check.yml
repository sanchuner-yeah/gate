name: Clean VPN Gate Node Check Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      REPO: ${{ github.repository }}
      WF_ID_VPNCHECK: 377545271
      WF_ID_SELF: 379230555
    steps:
      - name: 清理VPN检测工作流 + 清理本清理工作流历史记录，各保留最新1条
        run: |
          set -e
          # 两个工作流ID数组
          WF_LIST=($WF_ID_VPNCHECK $WF_ID_SELF)

          for WORKFLOW_ID in "${WF_LIST[@]}"; do
            echo "==================== 开始处理 Workflow ID: $WORKFLOW_ID ===================="
            # 获取【已结束】的run，正在运行的任务自动过滤，不会删除本次执行
            RUN_IDS=$(gh api --paginate "/repos/$REPO/actions/workflows/$WORKFLOW_ID/runs" | jq -r '.workflow_runs[] | select(.conclusion != null) | .id')

            if [ -z "$RUN_IDS" ]; then
              echo ">> 该工作流没有已完成记录，跳过"
              continue
            fi

            RUN_ARR=($RUN_IDS)
            TOTAL=${#RUN_ARR[@]}
            echo ">> 一共 $TOTAL 条已完成运行记录"

            if [ "$TOTAL" -le 1 ]; then
              echo ">> 记录数量≤1，无需删除"
              continue
            fi

            # 数组下标0=最新记录保留，i从1开始删除所有旧记录
            for ((i=1; i<TOTAL; i++)); do
              rid=${RUN_ARR[$i]}
              echo "删除旧Run ID: $rid"
              gh api -X DELETE "/repos/$REPO/actions/runs/$rid" || true
              sleep 0.3
            done
            echo ">> 当前Workflow清理完成"
          done

          echo "✅ 双工作流清理全部完成"
